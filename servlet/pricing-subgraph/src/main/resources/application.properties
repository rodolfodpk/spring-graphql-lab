spring.application.name=pricing-subgraph-servlet
server.port=8080
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=true
spring.graphql.websocket.path=/graphql
# Simulated datastore latency. Zero means the lab behaves exactly as it always has; set it (e.g.
# 50ms) only to compare stacks, since with no I/O to overlap they are indistinguishable.
app.repository.delay=0ms

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.web.discovery.enabled=false
