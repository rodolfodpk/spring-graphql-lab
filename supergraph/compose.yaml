name: spring-graphql-lab

services:
  products:
    build:
      # Root context so lab-model builds from source; STACK picks which twin is served.
      context: ..
      dockerfile: ${STACK:-reactive}/products-subgraph/Dockerfile
      args:
        BUILD_IMAGE: ${BUILD_IMAGE:-eclipse-temurin:21.0.11_10-jdk-jammy}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-eclipse-temurin:21.0.11_10-jre-jammy}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

  pricing:
    build:
      # Root context so lab-model builds from source; STACK picks which twin is served.
      context: ..
      dockerfile: ${STACK:-reactive}/pricing-subgraph/Dockerfile
      args:
        BUILD_IMAGE: ${BUILD_IMAGE:-eclipse-temurin:21.0.11_10-jdk-jammy}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-eclipse-temurin:21.0.11_10-jre-jammy}
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

  router:
    image: router
    build:
      context: ./router
    command:
      - --config
      - /config/router.yaml
      - --supergraph
      - /config/supergraph.graphql
    volumes:
      - ./router:/config:ro
    ports:
      - "4000:4000"
    depends_on:
      products:
        condition: service_healthy
      pricing:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8088/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  rover:
    image: ghcr.io/apollographql/rover:0.40.0
    profiles: ["tooling"]
    environment:
      APOLLO_ELV2_LICENSE: accept
    volumes:
      - ./:/work
    working_dir: /work
