name: Java CI

on:
  push:
    branches: [main, dual-stack]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        stack: [reactive, servlet]

    # Job level, not per step. Every step that shells out to Docker Compose must see this --
    # including the always() teardown. Because both stacks share service names, host ports and
    # image tags, a teardown running without STACK would fall back to reactive and tear down
    # against the wrong build context, and a missed teardown usually still exits zero.
    env:
      STACK: ${{ matrix.stack }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            model/pom.xml
            supergraph/pom.xml
            reactive/products-subgraph/pom.xml
            reactive/pricing-subgraph/pom.xml
            servlet/products-subgraph/pom.xml
            servlet/pricing-subgraph/pom.xml

      # The load-bearing check for the model/adapters split. Line 1 is lab-model itself; every
      # other line is a dependency and must be test-scoped. Deliberately avoids bracket escapes,
      # whose meaning varies between grep implementations.
      - name: Assert the model carries no production dependencies
        run: |
          # dependency:tree resolves outputFile against the module, not the working directory.
          ./mvnw -q -pl model dependency:tree -DoutputFile=model-tree.txt
          test -f model/model-tree.txt || { echo "::error::dependency:tree wrote no output"; exit 1; }
          cat model/model-tree.txt
          if tail -n +2 model/model-tree.txt | grep -v ':test$' | grep -q .; then
            echo "::error::lab-model gained a non-test dependency"
            tail -n +2 model/model-tree.txt | grep -v ':test$'
            exit 1
          fi

      - name: Test model and subgraphs
        working-directory: supergraph
        run: make test

      - name: Start federated stack
        working-directory: supergraph
        run: make up

      - name: Run smoke tests
        working-directory: supergraph
        run: make smoke

      - name: Run federated E2E tests
        working-directory: supergraph
        run: make e2e

      - name: Assert composition did not drift
        run: git diff --exit-code -- supergraph/schemas supergraph/router/supergraph.graphql

      - name: Stop federated stack
        if: always()
        working-directory: supergraph
        run: make down

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: >-
            model/target/site/jacoco/jacoco.xml,
            ${{ matrix.stack }}/products-subgraph/target/site/jacoco/jacoco.xml,
            ${{ matrix.stack }}/pricing-subgraph/target/site/jacoco/jacoco.xml
          flags: ${{ matrix.stack }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
