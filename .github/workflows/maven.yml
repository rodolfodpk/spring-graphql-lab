name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            sgl-local/pom.xml
            sgl-pricing/pom.xml
            sgl-products/pom.xml

      - name: Test subgraphs and local project
        working-directory: sgl-local
        run: make test

      - name: Start federated stack
        working-directory: sgl-local
        run: make up

      - name: Run smoke tests
        working-directory: sgl-local
        run: make smoke

      - name: Run federated E2E tests
        working-directory: sgl-local
        run: make e2e

      - name: Stop federated stack
        if: always()
        working-directory: sgl-local
        run: make down

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: sgl-products/target/site/jacoco/jacoco.xml,sgl-pricing/target/site/jacoco/jacoco.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
